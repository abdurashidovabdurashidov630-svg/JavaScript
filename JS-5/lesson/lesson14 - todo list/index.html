<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <div class="todo">
        <header>
            <img src="./assets/icons/menu.svg" alt="not found menu">

            </button>
        </form>
    </div>
    <script src="./script.js"></script>
</body>

</html>
