<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Orqa fondagi harakatlanuvchi abstrakt chiroyli shakllar */
        .background-shapes .shape {
            position: absolute;
            filter: blur(80px);
            z-index: 0;
            opacity: 0.5;
            animation: float 8s ease-in-out infinite alternate;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: #ff7eb3;
            top: 10%;
            left: 15%;
        }

        .shape-2 {
            width: 350px;
            height: 350px;
            background: #4facfe;
            bottom: 10%;
            right: 15%;
            animation-delay: -4s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) scale(1);
            }

            100% {
                transform: translateY(-30px) scale(1.05);
            }
        }

        /* Siz taqdim etgan HTML formani o'rab turuvchi konteyner dizayni va Hover effekti */
        #user_form {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;

            /* Silliq ko'tarilish uchun transition */
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                box-shadow 0.4s ease,
                border-color 0.4s ease;
        }

        /* Mishka forma ustiga kelganda tepaga ko'tarilishi */
        #user_form:hover {
            transform: translateY(-10px) scale(1.01);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
            border-color: rgba(255, 255, 255, 0.4);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px) scale(0.95);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }

        /* Parol inputi va ko'z tugmasini joylashtirish */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 45px;
        }

        #eye {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            opacity: 0.7;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        #eye:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Send tugmasi */
        #send {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 114, 255, 0.4);
        }

        #send:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(0, 114, 255, 0.6);
        }

        #send:active {
            transform: translateY(1px);
        }
    </style>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <form id="user_form">
        <div class="input-group">
            <label for="name">Ismingiz:</label>
            <input id="name" type="text" placeholder="Ismingizni kiriting" autocomplete="off">
        </div>

        <div class="input-group">
            <label for="password">Parolingiz:</label>
            <div class="password-wrapper">
                <input type="password" id="password" placeholder="Parolingizni kiriting">
                <button type="button" id="eye" title="Parolni ko'rsatish">👁️</button>
            </div>
        </div>

        <button type="submit" id="send">Send</button>
    </form>

    <script src="./app.js"></script>
</body>

</html>
