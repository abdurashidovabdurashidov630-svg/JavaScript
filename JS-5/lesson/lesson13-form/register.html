<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./css/register.css">
</head>

<body>
    <form>
        <div class="box">
            <div class="content">
                <h2>Register</h2>
                <div class="inp__box">
                    <input type="text" placeholder="Username">
                    <img src="./assets/icons/user.svg" alt="user is not found">
                </div>
                <div class="inp__box">
                    <input type="email" placeholder="Email">
                    <img src="./assets/icons/email.svg" alt="email is not found">
                </div>
                <div class="inp__box">
                    <input type="password" placeholder="Password">
                    <img class="lock" src="./assets/icons/lock.svg" alt="lock is not found">
                    <img class="unlock" src="./assets/icons/unlock.svg" alt="unlock is not found">
                </div>
                <button>Sign up</button>
                <p>Do you have an account? <a href="login.html">Sign in</a></p>
            </div>
        </div>
        <div class="box">
            <h1>Welcome <br> back?</h1>
            <p>Lorem ipsum dolor sit <br> amet consectetur <br> adipisicing.</p>
        </div>
    </form>
    <script src="./js/register.js"></script>
</body>

</html>
