<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/register.css">

<body>
    <form>
        <div class="right">
            <h1>Registration</h1>
            <div class="box">
                <input type="text" placeholder="Username" id="username">
                <img src="./assets/icons/user.svg" alt="not found user">
            </div>
            <div class="box">
                <input type="email" placeholder="Email" class="email">
                <img src="./assets/icons/email.svg" alt="not found email">
            </div>
            <div class="box">
                <input type="password" placeholder="Password" class="password">
                <img class="close" src="./assets/icons/lock-close.svg" alt="not found password">
                <img class="open" src="./assets/icons/lock-open.svg" alt="not found password">
            </div>
            <button class="register">Register</button>
            <p>or register with social platforms</p>
            <div class="wrapper">
                <div class="item">
                    <img src="./assets/icons/google.svg" alt="not found google">
                </div>
                <div class="item">
                    <img src="./assets/icons/facebook.svg" alt="not found facebook">
                </div>
                <div class="item">
                    <img src="./assets/icons/github.svg" alt="not found github">
                </div>
                <div class="item">
                    <img src="./assets/icons/linkedin.svg" alt="not found linkedin">
                </div>
            </div>
        </div>
        <div class="left">
            <h1>Welcome Back!</h1>
            <p>Already have an account?</p>
            <button class="signin">Login</button>
        </div>
    </form>
    <script src="./js/register.js"></script>
</body>

</html>
