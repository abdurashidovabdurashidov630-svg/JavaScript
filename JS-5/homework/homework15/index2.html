<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(125deg, rgba(131, 35, 209, 0.679), rgb(94, 40, 196), blueviolet);
            font-family: sans-serif;
        }

        form {
            width: 600px;
            height: 400px;
            border-radius: 40px;
            box-shadow: 0 0 30px white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        label {
            font-size: 30px;
            color: white;
        }

        input {
            width: 350px;
            height: 40px;
            font-size: 30px;
        }
        input::placeholder{
            color: black;
        }
        .a {
            position: relative;
        }

        #eye {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: none;
            font-size: 30px;
            background-color: transparent;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            right: 8px;
        }
        #send{
            padding: 14px 120px;
            font-size: 30px;
            border-radius: 60px;
            border: none;
        }
        .nur{
            background-color: rgba(246, 246, 144, 0.9);
            width: 310px;
            height: 40px;
            position: absolute;
            top: 0;
            right: 40px;
            visibility: hidden;
        }
    </style>
</head>

<body>
    <form id="user_form">
        <div>
            <label for="name">Ismingiz:</label>
            <input id="name" type="text" placeholder="Isminizni kiriting">
        </div>
        <div class="a">
            <label for="parol">Parolingiz:</label>
            <input type="password" id="password" placeholder="Parolingizni kiriting:">
            <button type="button" id="eye">👁️</button>
            <div class="nur"></div>
        </div>
        <button id="send">Send</button>
    </form>
    <script src="./script2.js"></script>
</body>

</html>
