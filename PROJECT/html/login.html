<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <form>
        <div class="header">
            <img src="../assets/icons/Container.svg" alt="img">
            <div class="h1_p">
                <h1>Xush kelibsiz</h1>
                <p>Hisobingizga kiring</p>
            </div>
        </div>
        <div class="footer">
            <div class="form">
                <div class="l_e">
                    <label for="email">Email</label>
                    <div class="email_icon">
                        <img src="../assets/icons/email.svg" alt="img">
                        <input type="email" placeholder="email@example.com" id="email">
                    </div>
                </div>
                <div class="l_e">
                    <label for="parol">Parol</label>
                    <div class="email_icon">
                        <img class="close" src="../assets/icons/lock.svg" alt="img" style="cursor: pointer;">
                        <img class="open" src="../assets/icons/lock-open.svg" alt="img" style="display: none; width: 20px;">
                        <input type="password" placeholder="••••••••" id="parol">
                    </div>
                </div>
                <div class="btn">Kirish</div>
            </div>
            <p>Hisobingiz yo'qmi? <a href="../html/register.html">Ro'yxatdan o'tish</p>
        </div>
    </form>
    <script src="../js/login.js"></script>
</body>

</html>
